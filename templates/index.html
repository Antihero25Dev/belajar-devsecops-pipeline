<!doctype html>
<html lang="id" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sistem Login Aman</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts Inter -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "sans-serif"],
                        },
                    },
                },
            };
        </script>
        <style>
            .bg-dark-pattern {
                background-color: #09090b; /* zinc-950 */
                background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.05) 1px, #09090b 1px);
                background-size: 32px 32px;
                background-position:
                    0 0,
                    16px 16px;
            }
        </style>
    </head>
    <body
        class="bg-dark-pattern text-zinc-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased selection:bg-blue-600 selection:text-white"
    >
        <!-- Ambient Radial Glow Behind Card -->
        <div class="fixed inset-0 pointer-events-none flex items-center justify-center">
            <div class="w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-3xl"></div>
        </div>

        <div
            class="relative w-full max-w-md bg-zinc-900/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-zinc-800/80 p-8 transition-all duration-300 hover:border-zinc-700/80"
        >
            <!-- Header Section -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-400 mb-4 border border-blue-500/20 shadow-inner"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-7 h-7">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
                        />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Portal Login</h2>
                <p class="text-sm text-zinc-400 mt-1.5">Masukkan kredensial Anda untuk melanjutkan</p>
            </div>

            {% if message %}
            <div class="mb-6 p-4 rounded-xl text-sm font-medium text-center shadow-lg border transition-all duration-200 {{ status_class }}">{{ message }}</div>
            {% endif %}

            <!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -->
            <form method="POST" action="/" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-zinc-300 mb-2">Nama Pengguna</label>
                    <div class="relative">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            placeholder="nama_pengguna"
                            class="w-full px-4 py-3 rounded-xl bg-zinc-950/60 border border-zinc-800 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/80 focus:border-blue-500 transition duration-200 text-sm shadow-inner"
                        />
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-300 mb-2">Kata Sandi</label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="w-full px-4 py-3 rounded-xl bg-zinc-950/60 border border-zinc-800 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/80 focus:border-blue-500 transition duration-200 text-sm shadow-inner"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 focus:ring-4 focus:ring-blue-500/30 text-white font-semibold rounded-xl transition-all duration-200 ease-in-out shadow-lg shadow-blue-600/25 active:scale-[0.98] cursor-pointer mt-2"
                >
                    Masuk
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-zinc-800/60 text-center text-xs text-zinc-500">
                &copy; {{ current_year|default:"2026" }} Sistem Login Aman. Hak cipta dilindungi.
            </div>
        </div>
    </body>
</html>
