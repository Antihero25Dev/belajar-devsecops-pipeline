name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              # --error membatalkan job jika ada temuan severity blocking/error
              run: semgrep scan --config auto --error --verbose

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # Berjalan paralel bersama sast-scan
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              # Job gagal jika nilai code quality di bawah 9.0/10
              run: pylint --fail-under=9.0 app.py

    # ==========================================
    # CD STAGE: Build & Deploy Langsung di VM VirtualBox
    # ==========================================
    deploy-to-vm:
        name: Build & Deploy to VirtualBox VM
        needs: [sast-scan, pylint-check] # WAjib lolos CI dulu
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build Docker Image and Run Container
              run: |
                  echo "Menjalankan build langsung di VM lokal..."
                  docker build -t secure-flask-app:latest .

                  echo "Restarting container web-flask..."
                  docker stop web-flask || true
                  docker rm web-flask || true

                  docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest

                  echo "Status container:"
                  docker ps | grep web-flask
