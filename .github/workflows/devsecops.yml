name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              # Menggunakan full 40-character SHA untuk actions/checkout@v4.1.7
              uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

            - name: Run Semgrep SAST
              # Batasi pemindaian pada file aplikasi (app.py) atau gunakan flag --exclude
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

            - name: Setup Python
              # Menggunakan full 40-character SHA untuk actions/setup-python@v5.1.1
              uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcb80e669f
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    # ==========================================
    # CD STAGE: Deploy ke VM
    # ==========================================
    deploy-to-vm:
        name: Build & Deploy to VirtualBox VM
        needs: [sast-scan, pylint-check]
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

            - name: Build and Run Container
              run: |
                  docker build -t secure-flask-app:latest .
                  docker stop web-flask || true
                  docker rm web-flask || true
                  docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
                  docker ps | grep web-flask
